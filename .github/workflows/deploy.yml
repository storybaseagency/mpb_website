name: Deploy zu all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # SMTP-Zugangsdaten für das Kontaktformular aus den Secrets auf den Server schreiben
      - name: SMTP-Konfiguration erzeugen
        if: env.SMTP_PASSWORD != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.FTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        run: >
          php -r 'file_put_contents("out/kontakt-config.php", "<?php return " . var_export(["host" => getenv("SMTP_HOST"), "user" => getenv("SMTP_USERNAME"), "pass" => getenv("SMTP_PASSWORD")], true) . ";\n");'

      # Ohne hinterlegte FTP-Zugangsdaten wird nur gebaut, nicht hochgeladen.
      - name: Upload per FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./

      - name: Neue Inhalte per IndexNow melden
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: npm run indexnow
